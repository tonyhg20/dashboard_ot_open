<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td style="padding: 32px 32px 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td style="font-size: 22px; font-weight: 800; color: #111827; letter-spacing: -0.03em;">
            {{ report_title }}
          </td>
          <td style="text-align: right; font-size: 13px; color: #6B7280; font-weight: 500;">
            {{ date_range }}
          </td>
        </tr>
      </table>
      <div style="height: 4px; background: linear-gradient(90deg, #0D9488 0%, #F97316 50%, #7C3AED 100%); border-radius: 2px; margin: 16px 0 0;"></div>
    </td>
  </tr>
  <tr>
    <td style="padding: 12px 32px 0; font-size: 12px; color: #9CA3AF;">
      {% if hubs %}{{ hubs | join(" · ") }}{% endif %}
    </td>
  </tr>
</table>
