<table cellpadding="0" cellspacing="0" border="0" width="600" align="center" style="border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0;">
  <tr>
    <td style="padding:20px 0 0 0;">
      <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0;">
        {% if title %}
        <tr>
          <td style="padding:0 0 2px 0;">
            <font face="Georgia, 'Times New Roman', serif" size="3" color="#1A1A1A" style="font-family:Georgia,'Times New Roman',serif;font-size:16px;color:#1A1A1A;font-weight:bold;">
              {{ title }}
            </font>
          </td>
        </tr>
        {% endif %}
        {% if subtitle %}
        <tr>
          <td style="padding:0 0 8px 0;">
            <font face="Arial, 'Helvetica Neue', Helvetica, sans-serif" size="1" color="#666666" style="font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;font-size:11px;color:#666666;">
              {{ subtitle }}
            </font>
          </td>
        </tr>
        {% endif %}
        <tr>
          <td align="center" style="padding:6px 0 0 0;">
            {% if chart_base64 %}
            <img src="{{ chart_base64 }}" alt="{{ title|default('Chart') }}" width="{{ chart_width|default(560) }}" style="display:block;border:0;outline:none;max-width:560px;height:auto;" />
            {% endif %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
